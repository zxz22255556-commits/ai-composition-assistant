<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AI 构图助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    overflow: hidden; position: fixed; }
  #wrap { display: flex; flex-direction: column; width: 100vw; height: 100vh; height: 100dvh; background: #000; }
  #cameraArea { flex: 1; position: relative; overflow: hidden; background: #000; }
  #video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .grid { position: absolute; inset: 0; pointer-events: none; }
  .grid .v { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.3); }
  .grid .h { position: absolute; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.3); }
  #topBar { flex-shrink: 0; z-index: 15; background: #000;
    padding: max(12px, env(safe-area-inset-top)) 16px 12px; pointer-events: none; }
  #status { display: inline-block; background: rgba(255,255,255,0.15); padding: 4px 12px;
    border-radius: 20px; font-size: 12px; margin-bottom: 6px; }
  #advice { font-size: 13px; line-height: 1.4; max-height: 40px; overflow: hidden; }
  #advice .label { font-size: 10px; color: #94D8C3; font-weight: 600; margin-bottom: 1px; }
  #flipBtn { width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,0.5);
    border: none; color: #fff; font-size: 18px; cursor: pointer;
    display: none; align-items: center; justify-content: center;
    position: absolute; top: 16px; right: 16px; z-index: 15; backdrop-filter: blur(10px); }
  #aiBtn {
    position: absolute; bottom: 100px; right: 20px; z-index: 15;
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(10px);
    border: 1.5px solid rgba(255,255,255,0.4);
    color: #fff; font-size: 11px; font-weight: 600;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; line-height: 1.2;
  }
  #aiBtn:active { transform: scale(0.92); }
  #aiBtn .icon { font-size: 18px; margin-bottom: 2px; }
  #aiBtn.loading { animation: btnPulse 1s ease-in-out infinite; }
  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0.5); }
    50% { box-shadow: 0 0 0 10px rgba(74,222,128,0); }
  }
  #analyzingTip {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.75); backdrop-filter: blur(10px);
    color: #fff; font-size: 14px; padding: 14px 24px; border-radius: 16px;
    display: none; z-index: 25; text-align: center;
  }
  #analyzingTip.show { display: block; }
  #analyzingTip .spinner {
    width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.2);
    border-top-color: #4ade80; border-radius: 50%;
    margin: 0 auto 8px; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #targetMarker { position: absolute; width: 72px; height: 72px;
    transform: translate(-50%, -50%); pointer-events: none; display: none; z-index: 10; }
  #targetMarker .ring { position: absolute; inset: 0; border: 2.5px solid #4ade80;
    border-radius: 50%; animation: pulse 1.8s ease-in-out infinite; }
  #targetMarker .ring-inner { position: absolute; inset: 22px; border: 1.5px solid #4ade80;
    border-radius: 50%; opacity: 0.7; }
  #targetMarker .cross-h { position: absolute; top: 50%; left: 8%; right: 8%;
    height: 1.5px; background: #4ade80; transform: translateY(-50%); }
  #targetMarker .cross-v { position: absolute; left: 50%; top: 8%; bottom: 8%;
    width: 1.5px; background: #4ade80; transform: translateX(-50%); }
  #targetMarker .label { position: absolute; top: 100%; left: 50%;
    transform: translateX(-50%); margin-top: 8px; background: rgba(74,222,128,0.92);
    color: #0a0a0a; font-size: 12px; font-weight: 700; padding: 3px 10px;
    border-radius: 10px; white-space: nowrap; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.18); opacity: 0.55; }
  }
  #targetMarker.aligned .ring { border-color: #facc15; animation: none; }
  #targetMarker.aligned .ring-inner { border-color: #facc15; }
  #targetMarker.aligned .cross-h, #targetMarker.aligned .cross-v { background: #facc15; }
  #targetMarker.aligned .label { background: rgba(250,204,21,0.92); }
  #subjectMarker { position: absolute; width: 56px; height: 56px;
    transform: translate(-50%, -50%); pointer-events: none; display: none; z-index: 9; }
  #subjectMarker .ring { position: absolute; inset: 0; border: 2.5px solid #60a5fa;
    border-radius: 50%; background: rgba(96,165,250,0.15); }
  #subjectMarker .dot { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px;
    background: #60a5fa; border-radius: 50%; transform: translate(-50%,-50%); }
  #subjectMarker .label { position: absolute; bottom: 100%; left: 50%;
    transform: translateX(-50%); margin-bottom: 6px; background: rgba(96,165,250,0.92);
    color: #0a0a0a; font-size: 11px; font-weight: 700; padding: 2px 8px;
    border-radius: 8px; white-space: nowrap; }
  #lineSvg { position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 8; }
  #centerCross { position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); width: 48px; height: 48px;
    pointer-events: none; z-index: 7; opacity: 0.5; }
  #centerCross .h { position: absolute; top: 50%; left: 0; right: 0;
    height: 1px; background: #fff; transform: translateY(-50%); }
  #centerCross .v { position: absolute; left: 50%; top: 0; bottom: 0;
    width: 1px; background: #fff; transform: translateX(-50%); }
  #centerCross .dot { position: absolute; top: 50%; left: 50%;
    width: 6px; height: 6px; background: #fff; border-radius: 50%;
    transform: translate(-50%, -50%); }
  #centerCross.aligned { opacity: 1; }
  #centerCross.aligned .h, #centerCross.aligned .v, #centerCross.aligned .dot { background: #facc15; }
  #alignTip { position: absolute; top: 12px;
    left: 50%; transform: translateX(-50%); background: rgba(250,204,21,0.95);
    color: #0a0a0a; font-size: 14px; font-weight: 700; padding: 8px 20px;
    border-radius: 20px; display: none; z-index: 20; }
  #hint { position: absolute; top: 12px;
    left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6);
    color: #fff; font-size: 12px; padding: 6px 14px; border-radius: 14px;
    white-space: nowrap; z-index: 5; }
  #bottomBar { flex-shrink: 0; z-index: 25;
    background: #000;
    padding: 16px 24px max(28px, env(safe-area-inset-bottom));
    display: none; align-items: center; justify-content: space-between; }
  #lastPhoto { width: 48px; height: 48px; border-radius: 8px; overflow: hidden;
    border: 2px solid rgba(255,255,255,0.8); background: rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center; cursor: pointer; }
  #lastPhoto img { width: 100%; height: 100%; object-fit: cover; display: none; }
  #lastPhoto .placeholder { font-size: 20px; opacity: 0.5; }
  #shutterBtn { width: 72px; height: 72px; border-radius: 50%;
    border: 4px solid #fff; background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.1s ease; padding: 0; }
  #shutterBtn .inner { width: 56px; height: 56px; border-radius: 50%;
    background: #fff; transition: transform 0.1s ease; }
  #shutterBtn:active { transform: scale(0.92); }
  #shutterBtn:active .inner { transform: scale(0.85); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0;
    pointer-events: none; z-index: 30; }
  #flash.active { animation: flashAnim 0.3s ease-out; }
  @keyframes flashAnim {
    0% { opacity: 0.9; }
    100% { opacity: 0; }
  }
  #startBtn { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    padding: 16px 32px; font-size: 17px; font-weight: 600; background: #fff; color: #000;
    border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    z-index: 40; }
  #startBtn:active { transform: translate(-50%,-50%) scale(0.96); }
  #photoPreview {
    position: fixed; inset: 0; background: rgba(0,0,0,0.92);
    z-index: 100; display: none; flex-direction: column;
    align-items: center; justify-content: center; padding: 20px;
  }
  #photoPreview.show { display: flex; }
  #previewImg { max-width: 100%; max-height: 70vh; border-radius: 8px; }
  .previewHint { color: #fff; font-size: 14px; margin-top: 16px; opacity: 0.8; text-align: center; }
  #closePreview {
    margin-top: 20px; padding: 10px 36px;
    background: rgba(255,255,255,0.15); color: #fff;
    border: 1px solid rgba(255,255,255,0.3); border-radius: 22px;
    font-size: 15px; cursor: pointer;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="topBar">
    <div id="status">点击开启相机</div>
    <div id="advice"><div class="label">AI 构图建议</div>点右下角 ✨ AI构图，移动手机让绿圈对准屏幕中心十字</div>
  </div>
  <div id="cameraArea">
    <video id="video" autoplay playsinline muted></video>
    <button id="flipBtn">⇄</button>
    <button id="aiBtn">
      <span class="icon">✨</span>
      <span>AI构图</span>
    </button>
    <div id="analyzingTip">
      <div class="spinner"></div>
      <div>正在分析画面…</div>
      <div style="font-size:11px;opacity:0.7;margin-top:4px;">保持手机平稳</div>
    </div>
    <div class="grid">
      <div class="v" style="left:33.33%"></div>
      <div class="v" style="left:66.66%"></div>
      <div class="h" style="top:33.33%"></div>
      <div class="h" style="top:66.66%"></div>
    </div>
    <div id="centerCross">
      <div class="h"></div>
      <div class="v"></div>
      <div class="dot"></div>
    </div>
    <div id="targetMarker">
      <div class="ring"></div><div class="ring-inner"></div>
      <div class="cross-h"></div><div class="cross-v"></div>
      <div class="label">主体放这里</div>
    </div>
    <div id="subjectMarker">
      <div class="ring"></div><div class="dot"></div>
      <div class="label">当前主体</div>
    </div>
    <svg id="lineSvg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(255,255,255,0.85)"/>
        </marker>
      </defs>
      <line id="guideLine" x1="0" y1="0" x2="0" y2="0" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)" style="display:none"/>
    </svg>
    <div id="alignTip">✓ 构图已对齐</div>
    <div id="hint">点击画面选择要拍的主体</div>
    <div id="flash"></div>
    <button id="startBtn">开启相机</button>
  </div>
  <div id="bottomBar">
    <div id="lastPhoto"><span class="placeholder">🖼️</span><img id="lastPhotoImg" alt=""></div>
    <button id="shutterBtn"><div class="inner"></div></button>
    <div style="width:48px;"></div>
  </div>
  <div id="photoPreview">
    <img id="previewImg" alt="">
    <div class="previewHint">长按图片 → 存储图像<br>保存到手机相册</div>
    <button id="closePreview">关闭</button>
  </div>
</div>
<script>
const API_PATH = '/api/analyze';
const video = document.getElementById('video');
const statusEl = document.getElementById('status');
const adviceEl = document.getElementById('advice');
const startBtn = document.getElementById('startBtn');
const flipBtn = document.getElementById('flipBtn');
const aiBtn = document.getElementById('aiBtn');
const analyzingTip = document.getElementById('analyzingTip');
const bottomBar = document.getElementById('bottomBar');
const shutterBtn = document.getElementById('shutterBtn');
const flash = document.getElementById('flash');
const lastPhotoImg = document.getElementById('lastPhotoImg');
const lastPhoto = document.getElementById('lastPhoto');
let stream = null;
let facing = 'environment';
let busy = false;
let subjectX = null;
let subjectY = null;
let hasSubject = false;
let lastTargetX = null;
let lastTargetY = null;
const wrap = document.getElementById('wrap');
const cameraArea = document.getElementById('cameraArea');
const subjectMarker = document.getElementById('subjectMarker');
const targetMarker = document.getElementById('targetMarker');
const guideLine = document.getElementById('guideLine');
const alignTip = document.getElementById('alignTip');
const hintEl = document.getElementById('hint');
const centerCross = document.getElementById('centerCross');
function selectSubject(clientX, clientY) {
  const rect = cameraArea.getBoundingClientRect();
  subjectX = (clientX - rect.left) / rect.width;
  subjectY = (clientY - rect.top) / rect.height;
  subjectX = Math.max(0, Math.min(1, subjectX));
  subjectY = Math.max(0, Math.min(1, subjectY));
  hasSubject = true;
  subjectMarker.style.left = (subjectX * 100) + '%';
  subjectMarker.style.top = (subjectY * 100) + '%';
  subjectMarker.style.display = 'block';
  hintEl.style.display = 'none';
  statusEl.textContent = '已选主体，点右下角 AI构图 开始分析';
}
cameraArea.addEventListener('click', (e) => {
  if (e.target.closest('button')) return;
  selectSubject(e.clientX, e.clientY);
});
cameraArea.addEventListener('touchstart', (e) => {
  if (e.target.closest('button')) return;
  const t = e.touches[0];
  selectSubject(t.clientX, t.clientY);
}, { passive: true });
async function openCamera() {
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1920 } },
      audio: false
    });
    video.srcObject = stream;
    startBtn.style.display = 'none';
    flipBtn.style.display = 'flex';
    aiBtn.style.display = 'flex';
    bottomBar.style.display = 'flex';
    statusEl.textContent = '点右下角 AI构图，移动手机让绿圈对准中心十字';
  } catch (e) {
    statusEl.textContent = '相机失败：' + e.message;
  }
}
aiBtn.addEventListener('click', () => {
  if (!busy && stream && video.videoWidth) {
    analyze();
  }
});
async function analyze() {
  if (busy || !stream || !video.videoWidth) return;
  busy = true;
  statusEl.textContent = '分析中…';
  aiBtn.classList.add('loading');
  analyzingTip.classList.add('show');
  try {
    const canvas = document.createElement('canvas');
    const w = video.videoWidth, h = video.videoHeight;
    const scale = Math.min(1, 640 / Math.max(w, h));
    canvas.width = Math.round(w * scale);
    canvas.height = Math.round(h * scale);
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    const img = canvas.toDataURL('image/jpeg', 0.72);
    const res = await fetch(API_PATH, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        image: img,
        subject_x: hasSubject ? subjectX : null,
        subject_y: hasSubject ? subjectY : null
      })
    });
    const data = await res.json();
    if (data.advice) {
      adviceEl.innerHTML = '<div class="label">AI 构图建议</div>' + escapeHtml(data.advice);
      statusEl.textContent = '建议已更新';
    } else {
      statusEl.textContent = '分析失败：' + (data.error || '未知错误');
    }
    if (data.target_x != null && data.target_y != null && data.target_x >= 0 && data.target_x <= 1 && data.target_y >= 0 && data.target_y <= 1) {
      lastTargetX = data.target_x;
      lastTargetY = data.target_y;
      targetMarker.style.left = (data.target_x * 100) + '%';
      targetMarker.style.top = (data.target_y * 100) + '%';
      targetMarker.style.display = 'block';
      const label = targetMarker.querySelector('.label');
      if (label && data.target_label) label.textContent = data.target_label;
      updateLine(data.target_x, data.target_y);
      checkAlignment(data.target_x, data.target_y);
    } else if (lastTargetX != null && lastTargetY != null) {
      statusEl.textContent = '保留上次构图建议';
    } else {
      targetMarker.style.display = 'none';
      guideLine.style.display = 'none';
      alignTip.style.display = 'none';
      centerCross.classList.remove('aligned');
    }
  } catch (e) {
    statusEl.textContent = '网络错误：' + e.message;
  } finally {
    busy = false;
    aiBtn.classList.remove('loading');
    analyzingTip.classList.remove('show');
  }
}
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function updateLine(tx, ty) {
  const rect = cameraArea.getBoundingClientRect();
  const sx = 0.5 * rect.width;
  const sy = 0.5 * rect.height;
  const ex = tx * rect.width;
  const ey = ty * rect.height;
  const dx = ex - sx, dy = ey - sy;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const shrink = dist > 36 ? 30 : dist * 0.5;
  const ex2 = dist > 0 ? ex - dx/dist * shrink : ex;
  const ey2 = dist > 0 ? ey - dy/dist * shrink : ey;
  guideLine.setAttribute('x1', sx);
  guideLine.setAttribute('y1', sy);
  guideLine.setAttribute('x2', ex2);
  guideLine.setAttribute('y2', ey2);
  guideLine.style.display = 'block';
}
function checkAlignment(tx, ty) {
  const dx = 0.5 - tx;
  const dy = 0.5 - ty;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist < 0.06) {
    alignTip.style.display = 'block';
    targetMarker.classList.add('aligned');
    centerCross.classList.add('aligned');
  } else {
    alignTip.style.display = 'none';
    targetMarker.classList.remove('aligned');
    centerCross.classList.remove('aligned');
  }
}
function takePhoto() {
  if (!stream || !video.videoWidth) return;
  flash.classList.remove('active');
  void flash.offsetWidth;
  flash.classList.add('active');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  if (facing === 'user') {
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
  lastPhotoImg.src = dataUrl;
  lastPhotoImg.style.display = 'block';
  lastPhoto.querySelector('.placeholder').style.display = 'none';
  const preview = document.getElementById('photoPreview');
  const previewImg = document.getElementById('previewImg');
  previewImg.src = dataUrl;
  preview.classList.add('show');
}
shutterBtn.addEventListener('click', takePhoto);
document.getElementById('closePreview').addEventListener('click', () => {
  document.getElementById('photoPreview').classList.remove('show');
});
lastPhoto.addEventListener('click', () => {
  if (lastPhotoImg.src) {
    window.open(lastPhotoImg.src, '_blank');
  }
});
window.addEventListener('resize', () => {
  if (targetMarker.style.display === 'block') {
    const left = parseFloat(targetMarker.style.left) / 100;
    const top = parseFloat(targetMarker.style.top) / 100;
    updateLine(left, top);
  }
});
startBtn.addEventListener('click', openCamera);
flipBtn.addEventListener('click', () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  openCamera();
});
</script>
</body>
</html>
